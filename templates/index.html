<!DOCTYPE html>

<title>Audio to MoM</title>

<form id="form">
    <label for="audio">Upload audio</label>
    <input type="file" name="audio" id="audio" accept=".mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm" required>

    <button type="submit">Submit</button>
</form>

<h2>Transcript</h2>
<p id="transcript"></p>

<h2>MoM</h2>

<h4>Abstract Summary:</h4>
<p id="abstract_summary"></p>

<h4>Key Points:</h4>
<p id="key_points" style="white-space: pre-wrap;"></p>

<h4>Action Items:</h4>
<p id="action_items" style="white-space: pre-wrap;"></p>

<script>
    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const audio = document.getElementById("audio").files[0];
        if (!audio) return;

        document.getElementById("transcript").textContent = "";
        document.getElementById("abstract_summary").textContent = "";
        document.getElementById("key_points").textContent = "";
        document.getElementById("action_items").textContent = "";

        const formData = new FormData();
        formData.append("audio", audio);

        const response = await fetch("/audio-to-mom", {method: "POST", body: formData});

        if (!response.ok) {
            document.getElementById("transcript").textContent = "Request gagal.";
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();

            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            const events = buffer.split("\n\n");
            buffer = events.pop();

            for (const event of events) {
                if (!event.startsWith("data: ")) continue;

                const data = JSON.parse(event.slice(6));

                if (data.type === "transcript") {
                    transcript.textContent += (transcript.textContent ? " " : "") + data.content;
                }

                if (data.type === "mom") {
                    document.getElementById(data.key).textContent += data.content;
                }

                if (data.type === "error") {
                    alert(data.message);
                }
            }
        }
    });
</script>
